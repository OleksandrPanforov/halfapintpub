{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" | default "" -}}
{{- $caption := .Get "caption" -}}
<figure>
  <img src="{{ $src }}" alt="{{ $alt }}" loading="lazy">
  {{- with $caption }}
  <figcaption><span class="cap-prompt">&gt;</span> {{ . | markdownify }}</figcaption>
  {{- end }}
</figure>

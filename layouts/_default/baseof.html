<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ .Site.Params.description | default .Site.Title }}">
  <meta name="theme-color" content="#121212">
  <title>{{ block "title" . }}{{ .Title }} - {{ .Site.Title }}{{ end }}</title>
  
  <!-- Winamp + Glitchpunk CSS -->
  <style>
    :root {
      /* === Winamp Color Palette === */
      --bg-dark: #121212;
      --bg-darker: #0a0a0a;
      --chrome-light: #c0c0c0;
      --chrome-medium: #808080;
      --chrome-dark: #404040;
      
      /* === Neon Accents (Winamp LCD) === */
      --neon-purple: #9d00ff;
      --neon-cyan: #00ffff;
      --neon-pink: #ff2ced;
      --neon-green: #00ff41;
      --neon-orange: #ff6b00;
      --neon-yellow: #ffff00;
      
      /* === Dark Theme === */
      --bg: var(--bg-dark);
      --card-bg: #1e1e1e;
      --text: #e0e0e0;
      --text-muted: #808080;
      --border: #404040;
      --shadow: rgba(0, 0, 0, 0.5);
      --link-color: var(--neon-cyan);
      --link-hover: var(--neon-purple);
      
      /* Fonts */
      --font-display: 'Orbitron', 'Courier New', monospace;
      --font-body: 'Courier New', monospace;
      --font-ui: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    /* Light theme override */
    [data-theme="light"] {
      --bg: #f0f0f0;
      --card-bg: #ffffff;
      --text: #121212;
      --text-muted: #606060;
      --border: #c0c0c0;
      --shadow: rgba(0, 0, 0, 0.1);
      --bg-dark: #e0e0e0;
      --bg-darker: #d0d0d0;
      --chrome-light: #404040;
      --chrome-medium: #808080;
      --chrome-dark: #c0c0c0;
      --link-color: #0066cc;
      --link-hover: #9d00ff;
    }
    
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    
    /* === CRT/Glitch Effects === */
    html {
      min-height: 100vh;
      background: var(--bg);
      /* Subtle scanlines */
      background-image: 
        linear-gradient(var(--bg-darker), var(--bg-darker)),
        repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.1) 0px,
          rgba(0, 0, 0, 0.1) 1px,
          transparent 1px,
          transparent 2px
        );
      background-size: 100% 4px;
    }
    
    /* Flicker effect */
    @keyframes crt-flicker {
      0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% { opacity: 0.99; }
      20%, 21.999%, 63%, 63.999%, 65%, 69.999% { opacity: 0.85; }
    }
    
    body {
      font-family: var(--font-body);
      color: var(--text);
      line-height: 1.7;
      animation: crt-flicker 8s infinite;
    }
    
    /* === Winamp Window Frame === */
    .winamp-window {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;
    }
    
    .winamp-window * {
      pointer-events: auto;
    }
    
    .winamp-title-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 32px;
      background: linear-gradient(180deg, var(--chrome-light) 0%, var(--chrome-medium) 100%);
      border-bottom: 2px solid var(--chrome-dark);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 12px;
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: bold;
      color: var(--chrome-dark);
      text-shadow: 1px 1px 0 var(--chrome-light);
      box-shadow: 0 0 10px rgba(157, 0, 255, 0.2);
    }
    
    .winamp-title-bar::before {
      content: '';
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--neon-purple) 0%, var(--neon-cyan) 100%);
      border: 1px solid var(--chrome-dark);
      box-shadow: 0 0 8px var(--neon-purple);
    }
    
    .winamp-title-bar-text {
      flex: 1;
      text-align: center;
      letter-spacing: 1px;
    }
    
    .winamp-window-controls {
      display: flex;
      gap: 6px;
    }
    
    .winamp-window-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    
    .winamp-window-controls .control {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      border: 1px solid var(--chrome-dark);
      background: var(--chrome-medium);
      color: var(--chrome-dark);
      box-shadow: inset 0 1px 0 var(--chrome-light);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .winamp-window-controls .control:hover {
      transform: scale(1.1);
    }
    
    .winamp-window-controls .control.close { 
      background: var(--neon-pink); 
      color: white; 
      box-shadow: 0 0 6px var(--neon-pink);
    }
    .winamp-window-controls .control.minimize { 
      background: var(--neon-cyan); 
      color: black; 
      box-shadow: 0 0 6px var(--neon-cyan);
    }
    .winamp-window-controls .control.maximize { 
      background: var(--neon-orange); 
      color: white; 
      box-shadow: 0 0 6px var(--neon-orange);
    }
    
    /* Menu Bar */
    .winamp-menu-bar {
      position: absolute;
      top: 32px;
      left: 0;
      right: 0;
      height: 28px;
      background: linear-gradient(180deg, var(--chrome-medium) 0%, var(--chrome-light) 100%);
      border-bottom: 1px solid var(--chrome-dark);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 4px;
      z-index: 999;
    }
    
    .winamp-menu-bar * {
      pointer-events: auto;
    }
    
    .winamp-menu-bar .menu-item {
      padding: 4px 12px;
      font-family: var(--font-ui);
      font-size: 12px;
      color: var(--chrome-dark);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: 1px solid transparent;
      border-radius: 3px;
      transition: all 0.2s ease;
      background: transparent;
    }
    
    .winamp-menu-bar .menu-item:hover {
      background: var(--chrome-light);
      border-color: var(--chrome-dark);
      color: var(--neon-purple);
      text-shadow: 0 0 4px var(--neon-purple);
    }
    
    .winamp-menu-bar .menu-item.active {
      background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
      color: white;
      border-color: var(--neon-purple);
      box-shadow: 0 0 6px var(--neon-purple);
    }
    
    .winamp-border {
      position: absolute;
      top: 60px;
      left: 0;
      right: 0;
      bottom: 0;
      border-left: 2px solid var(--chrome-dark);
      border-right: 2px solid var(--chrome-dark);
      border-bottom: 2px solid var(--chrome-dark);
      border-radius: 0 0 8px 8px;
      box-shadow: 
        inset 0 0 30px rgba(157, 0, 255, 0.05),
        0 0 20px rgba(157, 0, 255, 0.15);
    }
    
    /* === Layout === */
    .page-container {
      max-width: 840px;
      margin: 88px auto 2rem;
      padding: 2rem;
      position: relative;
      z-index: 10;
      min-height: calc(100vh - 148px);
    }
    
    /* === Header === */
    .site-header {
      margin-bottom: 2.5rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    
    .site-header h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 15px rgba(157, 0, 255, 0.5);
      letter-spacing: 2px;
    }
    
    .site-header h1 a {
      color: inherit;
      text-decoration: none;
    }
    
    .site-header h1 a:hover {
      text-shadow: 
        4px 4px 0 var(--neon-purple),
        -4px -4px 0 var(--neon-cyan);
      animation: rgb-split 0.5s ease;
    }
    
    .site-tagline {
      color: var(--text-muted);
      font-size: 1.125rem;
      font-family: var(--font-ui);
      margin-bottom: 1.5rem;
      letter-spacing: 1px;
    }
    
    /* === Equalizer Animation (Winamp-style) === */
    .equalizer-container {
      display: flex;
      justify-content: center;
      margin: 1.5rem 0;
      height: 40px;
      align-items: center;
    }
    
    .equalizer {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      height: 32px;
      padding: 0 16px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--chrome-dark);
      border-radius: 4px;
      box-shadow: inset 0 0 10px rgba(157, 0, 255, 0.1);
    }
    
    .equalizer .bar {
      width: 6px;
      background: linear-gradient(180deg, var(--neon-purple), var(--neon-cyan));
      border-radius: 2px;
      animation: equalizer 0.5s ease infinite alternate;
      box-shadow: 0 0 4px var(--neon-purple);
    }
    
    .equalizer .bar:nth-child(1) { height: 30%; animation-delay: 0s; }
    .equalizer .bar:nth-child(2) { height: 60%; animation-delay: 0.1s; }
    .equalizer .bar:nth-child(3) { height: 100%; animation-delay: 0.2s; }
    .equalizer .bar:nth-child(4) { height: 40%; animation-delay: 0.3s; }
    .equalizer .bar:nth-child(5) { height: 80%; animation-delay: 0.4s; }
    .equalizer .bar:nth-child(6) { height: 30%; animation-delay: 0.5s; }
    .equalizer .bar:nth-child(7) { height: 70%; animation-delay: 0.6s; }
    .equalizer .bar:nth-child(8) { height: 50%; animation-delay: 0.7s; }
    .equalizer .bar:nth-child(9) { height: 90%; animation-delay: 0.8s; }
    .equalizer .bar:nth-child(10) { height: 40%; animation-delay: 0.9s; }
    .equalizer .bar:nth-child(11) { height: 60%; animation-delay: 1.0s; }
    .equalizer .bar:nth-child(12) { height: 35%; animation-delay: 1.1s; }
    .equalizer .bar:nth-child(13) { height: 85%; animation-delay: 1.2s; }
    
    @keyframes equalizer {
      0% { height: 20%; opacity: 0.5; }
      50% { opacity: 1; }
      100% { height: 100%; opacity: 0.7; }
    }
    
    /* === Winamp Button Style === */
    .winamp-btn {
      display: inline-block;
      padding: 0.625rem 1.25rem;
      font-family: var(--font-ui);
      font-size: 0.875rem;
      font-weight: bold;
      color: var(--text);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: linear-gradient(135deg, var(--chrome-medium) 0%, var(--chrome-light) 100%);
      border: 2px solid;
      border-color: var(--chrome-dark) var(--chrome-light) var(--chrome-light) var(--chrome-dark);
      border-radius: 4px;
      box-shadow: 
        -2px -2px 0 var(--chrome-dark),
        2px 2px 0 var(--chrome-light);
      transition: all 0.2s ease;
    }
    
    .winamp-btn:hover {
      border-color: var(--chrome-light) var(--chrome-dark) var(--chrome-dark) var(--chrome-light);
      box-shadow: 
        2px 2px 0 var(--chrome-dark),
        -2px -2px 0 var(--chrome-light);
      transform: translateY(-2px);
      color: var(--neon-cyan);
    }
    
    .winamp-btn:active {
      transform: translateY(1px);
      border-color: var(--chrome-dark);
      box-shadow: 
        1px 1px 0 var(--chrome-light),
        -1px -1px 0 var(--chrome-dark);
    }
    
    /* === Glitch Effect on Links === */
    a {
      color: var(--link-color);
      text-decoration: none;
      transition: all 0.3s ease;
      position: relative;
    }
    
    a:hover {
      color: var(--link-hover);
    }
    
    a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--neon-purple), var(--neon-cyan));
      transition: width 0.3s ease;
    }
    
    a:hover::after {
      width: 100%;
    }
    
    /* RGB Split Glitch Effect */
    @keyframes rgb-split {
      0% { text-shadow: 0 0 0; }
      20% { text-shadow: 3px 0 0 var(--neon-purple), -3px 0 0 var(--neon-cyan); }
      40% { text-shadow: -3px 0 0 var(--neon-purple), 3px 0 0 var(--neon-cyan); }
      60% { text-shadow: 0 3px 0 var(--neon-purple), 0 -3px 0 var(--neon-cyan); }
      80% { text-shadow: 0 -3px 0 var(--neon-purple), 0 3px 0 var(--neon-cyan); }
      100% { text-shadow: 0 0 0; }
    }
    
    /* === Card/Article Style === */
    article, .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 
        0 4px 8px var(--shadow),
        inset 0 0 20px rgba(157, 0, 255, 0.05);
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    
    article:hover, .card:hover {
      transform: translateY(-2px);
      box-shadow: 
        0 6px 12px var(--shadow),
        inset 0 0 30px rgba(157, 0, 255, 0.08);
    }
    
    article::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--neon-purple), var(--neon-cyan), var(--neon-pink));
    }
    
    article h2 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
      color: var(--neon-cyan);
    }
    
    article h2 a {
      color: inherit;
    }
    
    article h2 a:hover {
      animation: rgb-split 0.5s ease;
    }
    
    article time {
      display: block;
      color: var(--text-muted);
      font-size: 0.875rem;
      font-family: var(--font-ui);
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    article p {
      color: var(--text);
      margin-bottom: 1rem;
      line-height: 1.8;
    }
    
    article p + p {
      margin-top: 1rem;
    }
    
    /* === Main Content === */
    main {
      display: grid;
      gap: 1.5rem;
    }
    
    /* === Navigation === */
    .nav-back {
      margin: 2rem 0;
    }
    
    /* === Footer === */
    .site-footer {
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
      font-family: var(--font-ui);
    }
    
    .site-footer a {
      color: var(--neon-cyan);
    }
    
    .site-footer .tags {
      margin-top: 1rem;
      font-size: 0.75rem;
    }
    
    .site-footer .tags span {
      margin: 0 0.5rem;
    }
    
    /* === Theme Toggle === */
    .theme-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1001;
      background: var(--chrome-medium);
      border: 2px solid var(--chrome-dark);
      border-radius: 50%;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 
        0 4px 0 var(--chrome-dark),
        inset 0 0 10px rgba(255, 255, 255, 0.2);
      transition: all 0.2s ease;
    }
    
    .theme-toggle:hover {
      transform: scale(1.15);
      box-shadow: 
        0 6px 0 var(--chrome-dark),
        inset 0 0 15px rgba(255, 255, 255, 0.3);
    }
    
    .theme-toggle:active {
      transform: scale(0.95);
    }
    
    .theme-toggle svg {
      width: 26px;
      height: 26px;
      fill: var(--neon-cyan);
    }
    
    /* === VHS Static Overlay (Subtle) === */
    .vhs-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: -1;
      background: 
        radial-gradient(ellipse at 15% 25%, rgba(157, 0, 255, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 75%, rgba(0, 255, 255, 0.08) 0%, transparent 50%);
      animation: vhs-noise 20s infinite;
    }
    
    @keyframes vhs-noise {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.6; }
    }
    
    /* === Glitch Bar Effect === */
    .glitch-bar {
      position: fixed;
      top: 60px;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, 
        transparent, 
        var(--neon-purple), 
        var(--neon-cyan), 
        var(--neon-pink), 
        transparent, 
        var(--neon-purple), 
        var(--neon-cyan));
      opacity: 0.5;
      animation: glitch-bar 6s infinite;
      pointer-events: none;
      z-index: 999;
    }
    
    @keyframes glitch-bar {
      0% { transform: translateX(-100%); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { transform: translateX(100%); opacity: 0; }
    }
    
    /* === Content Body Styling === */
    .content-body {
      line-height: 1.9;
      color: var(--text);
    }
    
    .content-body h1,
    .content-body h2,
    .content-body h3,
    .content-body h4,
    .content-body h5,
    .content-body h6 {
      font-family: var(--font-display);
      color: var(--neon-cyan);
      margin-top: 2rem;
      margin-bottom: 1rem;
    }
    
    .content-body h2 {
      font-size: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }
    
    .content-body h3 {
      font-size: 1.25rem;
    }
    
    .content-body blockquote {
      border-left: 4px solid var(--neon-purple);
      padding-left: 1rem;
      margin-left: 0;
      color: var(--text-muted);
      font-style: italic;
      background: rgba(157, 0, 255, 0.05);
      padding: 1rem;
      border-radius: 0 4px 4px 0;
    }
    
    .content-body code {
      background: rgba(0, 255, 255, 0.1);
      padding: 0.2rem 0.4rem;
      border-radius: 3px;
      font-family: var(--font-body);
      font-size: 0.9em;
      border: 1px solid var(--neon-cyan);
    }
    
    .content-body pre {
      background: var(--bg-darker);
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      border: 1px solid var(--border);
      margin: 1rem 0;
    }
    
    .content-body pre code {
      background: none;
      padding: 0;
      border: none;
      font-size: 0.9em;
    }
    
    /* === Responsive Design === */
    @media (max-width: 768px) {
      .winamp-title-bar {
        height: 24px;
        padding: 0 6px;
        font-size: 10px;
      }
      
      .winamp-window-controls .control {
        width: 14px;
        height: 14px;
        font-size: 7px;
      }
      
      .winamp-menu-bar {
        top: 24px;
        height: 22px;
        padding: 0 6px;
        gap: 2px;
      }
      
      .winamp-menu-bar .menu-item {
        padding: 2px 8px;
        font-size: 10px;
      }
      
      .winamp-border {
        top: 46px;
      }
      
      .glitch-bar {
        top: 46px;
      }
      
      .page-container {
        margin: 66px auto 1.5rem;
        min-height: calc(100vh - 112px);
      }
      
      .page-container {
        margin: 40px auto 1.5rem;
        padding: 1.25rem;
        min-height: auto;
      }
      
      .site-header h1 {
        font-size: 1.75rem;
      }
      
      .site-tagline {
        font-size: 0.95rem;
      }
      
      .equalizer {
        height: 24px;
      }
      
      .equalizer .bar {
        width: 4px;
      }
      
      .theme-toggle {
        width: 44px;
        height: 44px;
        bottom: 16px;
        right: 16px;
      }
      
      .theme-toggle svg {
        width: 22px;
        height: 22px;
      }
    }
    
    @media (max-width: 480px) {
      .page-container {
        padding: 1rem;
      }
      
      .site-header h1 {
        font-size: 1.5rem;
      }
      
      article, .card {
        padding: 1rem;
      }
      
      .winamp-btn {
        padding: 0.5rem 1rem;
        font-size: 0.8rem;
      }
      
      .winamp-menu-bar .menu-item {
        padding: 2px 6px;
        font-size: 9px;
      }
    }
    
    /* === Print Styles === */
    @media print {
      .winamp-window,
      .theme-toggle,
      .vhs-overlay,
      .glitch-bar {
        display: none !important;
      }
      
      body {
        animation: none;
        background: white;
        color: black;
      }
    }
  </style>
  
  <!-- Winamp Window Overlay -->
  <div class="winamp-window">
    <div class="winamp-title-bar">
      <span class="winamp-title-bar-text">{{ .Site.Title }}</span>
      <div class="winamp-window-controls">
        <a href="{{ .Site.BaseURL }}" class="control close">X</a>
        <a href="{{ .Site.BaseURL }}about/" class="control minimize">_</a>
        <span class="control maximize">[]</span>
      </div>
    </div>
    <div class="winamp-menu-bar">
      <a href="{{ .Site.BaseURL }}" class="menu-item" id="menu-home">Home</a>
      <a href="{{ .Site.BaseURL }}about/" class="menu-item" id="menu-about">About</a>
      <a href="{{ .Site.BaseURL }}posts/" class="menu-item" id="menu-blog">Blog</a>
      <span class="menu-item" style="margin-left: auto;">{{ .Site.Params.tagline | default "" }}</span>

<body>
  <div class="page-container">
    <header class="site-header">
      <h1><a href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a></h1>
      {{ with .Site.Params.tagline }}<p class="site-tagline">{{ . }}</p>{{ end }}
      {{ with .Site.Params.description }}<p>{{ . }}</p>{{ end }}
      <div class="equalizer-container">
        <div class="equalizer">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
      </div>
    </header>
    
    {{ block "main" . }}{{ end }}
  </div>
  
  <!-- Theme Toggle -->
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
    <svg id="theme-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" fill="currentColor"/>
    </svg>
  </button>
  
  <script>
    // Theme Toggle
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const next = current === 'light' ? 'dark' : 'light';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateIcon(next);
    }
    
    function updateIcon(theme) {
      const icon = document.getElementById('theme-icon');
      if (theme === 'light') {
        icon.innerHTML = '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" fill="currentColor"/>';
      } else {
        icon.innerHTML = '<path d="M12 3v1M12 20v1M3 12h1M20 12h1M18.36 4.64l.71.71M5.29 18.71l.71.71M4.64 18.36l.71-.71M18.71 5.29l-.71-.71M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z" fill="none" stroke="currentColor" stroke-width="2"/>';
      }
    }
    
    // Initialize theme
    (function() {
      const saved = localStorage.getItem('theme') || 
        (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', saved);
      updateIcon(saved);
    })();
    
    // Set active menu item
    (function() {
      const path = window.location.pathname;
      const menuItems = document.querySelectorAll('.winamp-menu-bar .menu-item');
      menuItems.forEach(item => {
        item.classList.remove('active');
        const href = item.getAttribute('href') || '';
        // Match exact or directory
        if (path === href || path.startsWith(href) && href !== '/') {
          item.classList.add('active');
        }
      });
    })();
    
    // Glitch effect on hover for titles
    document.addEventListener('DOMContentLoaded', function() {
      const titles = document.querySelectorAll('h1 a, h2 a, h3 a');
      titles.forEach(title => {
        title.addEventListener('mouseenter', function() {
          this.style.animation = 'rgb-split 0.5s ease';
        });
      });
    });
    
    // Random glitch effect on articles
    function randomGlitch() {
      const elements = document.querySelectorAll('article, .card');
      if (elements.length === 0) return;
      
      const randomEl = elements[Math.floor(Math.random() * elements.length)];
      if (randomEl) {
        const x = (Math.random() - 0.5) * 6;
        const y = (Math.random() - 0.5) * 4;
        randomEl.style.transform = `translate(${x}px, ${y}px)`;
        randomEl.style.boxShadow = `0 0 15px rgba(157, 0, 255, 0.5)`;
        setTimeout(() => {
          randomEl.style.transform = '';
          randomEl.style.boxShadow = '';
        }, 150);
      }
    }
    
    // Trigger random glitch every 6-10 seconds
    setInterval(randomGlitch, 6000 + Math.random() * 4000);
    
    // Pulsing equalizer effect on scroll
    window.addEventListener('scroll', function() {
      const equalizer = document.querySelector('.equalizer');
      if (equalizer) {
        const scrolled = window.pageYOffset;
        const rate = scrolled * -0.1;
        equalizer.style.transform = `scaleY(${1 + Math.sin(scrolled * 0.01) * 0.05})`;
      }
    });
  </script>
</body>
</html>

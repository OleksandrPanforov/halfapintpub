{{ define "title" }}{{ .Title }} - {{ .Site.Title }}{{ end }}

{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ range .Pages }}
    <article>
      <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      <time>{{ .Date.Format "2006-01-02" }}</time>
      <p>{{ .Summary }}</p>
      <p><a href="{{ .RelPermalink }}">Read more...</a></p>
    </article>
  {{ end }}
{{ end }}

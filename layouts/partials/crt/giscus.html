<h2 class="section-title giscus-title"><span class="prompt">&gt;</span> {{ i18n "comments_title" | default "Comments" }}</h2>
<div class="giscus"></div>
<script src="https://giscus.app/client.js"
  data-repo="OleksandrPanforov/halfapintpub"
  data-repo-id="{{ site.Params.giscus_repo_id }}"
  data-category="{{ site.Params.giscus_category | default "General" }}"
  data-mapping="pathname"
  data-strict="0"
  data-reactions-enabled="1"
  data-emit-metadata="0"
  data-input-position="top"
  data-theme="dark_dimmed"
  data-lang="{{ .Lang }}"
  data-loading="lazy"
  crossorigin="anonymous"
  async></script>

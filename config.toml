baseURL = "https://halfapintpub.com/"
title = "halfapintpub"
publishDir = "public"
defaultContentLanguage = "uk"
disableKinds = ["taxonomy", "term"]

[languages]
  [languages.uk]
    label = "Українська"
    weight = 1
    title = "Паб пів пінти"
    
  [languages.en]
    label = "English"
    weight = 2
    title = "Half A Pint Pub"

[params]
  description = "TTRPG adventures, hobby projects, and late-2000s nostalgia"
  tagline = "Glitchpunk & Winamp-inspired ramblings"
  logo = "/logo.png"
  giscus_repo_id = "R_kgDOTl5d2A"
  giscus_category = "General"

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
